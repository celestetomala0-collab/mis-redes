<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michelle Carolina | Mis Redes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif;}
  body{background:#080815;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;}
  .stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
  .star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;animation:twinkle 2.5s infinite alternate;}
  @keyframes twinkle{0%{opacity:0.2;}100%{opacity:1;box-shadow:0 0 10px white;}}
  .container{background:rgba(255,255,255,0.07);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.15);border-radius:32px;padding:35px 28px;width:90%;max-width:390px;text-align:center;z-index:10;box-shadow:0 0 50px rgba(168,85,247,0.35);}
  .avatar{width:120px;height:120px;border-radius:50%;border:3px solid #c084fc;margin:0 auto 15px;background-image:url('foto.jpg');background-size:cover;background-position:center top;box-shadow:0 0 20px rgba(168,85,247,0.6);}
  h1{font-size:24px;margin-bottom:4px;} .user{font-size:13px;opacity:0.6;margin-bottom:24px;letter-spacing:1px;}
  .link{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;margin:13px 0;border-radius:50px;text-decoration:none;color:white;font-weight:600;transition:0.25s;font-size:16px;}
  .link:hover{transform:scale(1.04) translateY(-2px);}
  .tiktok{background:#000;border:1px solid #333;}
  .whatsapp{background:linear-gradient(90deg,#128C7E,#25D366);}
  .instagram{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);}
  .facebook{background:linear-gradient(90deg,#1877F2,#4a7fe8);}
  .footer{margin-top:22px;font-size:11px;opacity:0.4;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <div class="avatar"></div>
  <h1>Michelle Carolina ✨</h1>
  <div class="user">@siganme</div>
  <a class="link tiktok" href="https://www.tiktok.com/@caro_tomala_" target="_blank">🎵 TikTok</a>
  <a class="link whatsapp" href="https://wa.me/593961934078" target="_blank">💬 WhatsApp</a>
  <a class="link instagram" href="https://www.instagram.com/carolina_tomala_" target="_blank">📸 Instagram</a>
  <a class="link facebook" href="https://www.facebook.com/michelle.carolina.559137" target="_blank">📘 Facebook</a>
  <div class="footer">Mis redes sociales</div>
</div>
<script>
  const starsContainer=document.getElementById('stars');
  for(let i=0;i<180;i++){let s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*4+'s';let size=Math.random()*2.5+0.5;s.style.width=size+'px';s.style.height=size+'px';starsContainer.appendChild(s);}
</script>
</body>
</html>
